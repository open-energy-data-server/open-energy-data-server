[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oeds"
version = "0.0.1"
description = "Open energy data server"
authors = [{ name = "Florian Maurer", email = "maurer@fh-aachen.de"}]
license = "AGPL-3.0-or-later"
readme = "README.md"
keywords = ["open data", "energy", "mobility"]

classifiers=[
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy >=2.0.0",
    "psycopg[binary] >=3.1.0",
    "pandas >=2.0.0",
    "numpy >=1.26.4",
    "python-dateutil >=2.8.2",
    "pyyaml >=6.0.2",
    "requests >=2.31.0",
    "beautifulsoup4 >=4.12.0",
    "tqdm >=4.66.0",
    "geoalchemy2 >=0.14.0",
    "geopandas >=0.14.0",
    "shapely >=2.0.0",
    "geopy >=2.4.0",
    "cdsapi >=0.7.0",
    "cfgrib >=0.9.10",
    "cloudscraper >=1.2.71",
    "entsoe-py >=0.8.1",
    "jao-py >=0.6.9",
    "json5 >=0.9.14",
    "matplotlib >=3.8.0",
    "netztransparenz >=0.2.3",
    "open-mastr >=0.15.0",
    "openpyxl >=3.1.0",
    "lxml >=5.0.0",
    "py7zr >=0.20.0",
    "pygrib >=2.1.6",
    "pyshp >=2.3.0",
    "pyogrio >=0.7.0",
    "roiti-gie >=1.0.1",
    "xarray >=2024.1.0",
    "yfinance >=0.2.38",
]

[project.optional-dependencies]
test = [
    "pytest >=8.0.0",
]

[project.scripts]
oeds = "oeds.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["oeds*"]

[tool.setuptools.package-data]
"*" = ["*.json", "*.npy", "*.csv", "*.license"]
