services:
  open-data-17:
    image: timescale/timescaledb-ha:pg17-oss
    container_name: open-data-17
    restart: always
    shm_size: 32g
    command: postgres -c 'max_connections=6000' -c 'timescaledb.max_background_workers=32' -c 'timescaledb.telemetry_level=off'
    environment:
      - POSTGRES_USER=opendata
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=opendata
      - PGDATA=/var/lib/postgresql/data
    volumes:
      - ./data/open-data-ha:/var/lib/postgresql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql

    ports:
      - "6432:5432"

  pgadmin:
    user: root
    image: dpage/pgadmin4:latest
    container_name: pgadmin4
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PG_MAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PG_PW}
      PGADMIN_LISTEN_PORT: 80
      PGADMIN_CONFIG_UPGRADE_CHECK_ENABLED: "False"
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    volumes:
      - ./data/pgadmin:/var/lib/pgadmin
      - ./data/provisioning/pgadmin/servers.json:/pgadmin4/servers.json
    ports:
      - "8080:80"
    depends_on:
      - open-data-17

  open-postgrest:
    image: postgrest/postgrest:latest
    container_name: postgrest
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://readonly:${READONLY_PW}@open-data-17:5432/${DB_NAME}
      PGRST_DB_PRE_CONFIG: postgrest.pre_config
      PGRST_DB_ANON_ROLE: readonly
      PGRST_DB_AGGREGATES_ENABLED: True
    depends_on:
      - open-data-17

  grafana:
    image: grafana/grafana-oss:latest
    container_name: oeds-grafana
    user: "104"
    depends_on:
      - open-data-17
    ports:
      - 3006:3000
    environment:
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_INSTALL_PLUGINS: "marcusolsson-dynamictext-panel,orchestracities-map-panel"
      GF_SECURITY_ADMIN_USER: opendata
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PW}
      GF_LOG_FILTERS: rendering:debug
    volumes:
      - ./data/provisioning/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./data/provisioning/grafana/dashboardproviders:/etc/grafana/provisioning/dashboards
      - ./data/provisioning/grafana/dashboards:/var/lib/grafana/dashboards
    restart: always

  postgres:
    image: postgres:14
    container_name: prefect-postgres
    environment:
      POSTGRES_USER: ${PREFECT_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PREFECT_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PREFECT_POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U prefect" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  prefect-server:
    image: prefecthq/prefect:3-latest
    container_name: prefect-server
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_REDIS_MESSAGING_PASSWORD: ${PREFECT_REDIS_MESSAGING_PASSWORD}
      PREFECT_SERVER_API_HOST: 0.0.0.0
      PREFECT_API_URL: http://88.214.56.50:4200/api
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server start --no-services
    ports:
      - "4200:4200"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:4200/api/health', timeout=1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prefect-services:
    image: prefecthq/prefect:3-latest
    container_name: prefect-services
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: ${PREFECT_API_DATABASE_CONNECTION_URL}
      PREFECT_REDIS_MESSAGING_PASSWORD: ${PREFECT_REDIS_MESSAGING_PASSWORD}
      PREFECT_MESSAGING_BROKER: prefect_redis.messaging
      PREFECT_MESSAGING_CACHE: prefect_redis.messaging
      PREFECT_REDIS_MESSAGING_HOST: redis
      PREFECT_REDIS_MESSAGING_PORT: 6379
      PREFECT_API_URL: http://88.214.56.50:4200/api
      PREFECT_REDIS_MESSAGING_DB: 0
    command: prefect server services start

  prefect-worker:
    image: prefecthq/prefect:3-latest
    container_name: prefect-worker
    depends_on:
      prefect-server:
        condition: service_healthy
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
    volumes:
       - /root/open-energy-data-server:/root/open-energy-data-server
    command: prefect worker start --pool local-pool
    restart: on-failure

  metabase:
    image: metabase/metabase:latest
    container_name: metabase
    hostname: metabase
    volumes:
      - ./data/metabase:/metabase-data
    ports:
      - 3000:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabaseappdb
      MB_DB_PORT: 5432
      MB_DB_USER: metabase
      MB_DB_PASS: ${METABASE_PW}
      MB_DB_HOST: postgres-metabase
      JAVA_OPTS: "-Xms1g -Xmx2g"
      MB_SAMPLE_DATABASE: "false"
    healthcheck:
      test: curl --fail -I http://localhost:3000/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5
  postgres-metabase:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    environment:
      POSTGRES_USER: metabase
      POSTGRES_DB: metabaseappdb
      POSTGRES_PASSWORD: ${POSTGRES_METABASE_PW}

volumes:
  postgres_data:
  redis_data: