name: Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      opendata-db:
        image: postgres:alpine
        env:
          POSTGRES_DB: opendata
          POSTGRES_PASSWORD: opendata
          POSTGRES_PORT: 5432
          POSTGRES_USER: opendata
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Clone this repository
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" ruff

      - name: Run ruff check
        run: ruff check --config ruff.toml .

      - name: Run ruff check format
        run: ruff format --check .

      - name: Run test suite
        env:
          OEDS_TEST_DB_URI: postgresql://opendata:opendata@localhost:5432/opendata
        run: pytest -v
